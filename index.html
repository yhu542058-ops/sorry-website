<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I'm Sorry</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #1b1b3a 0%, #0d0d1a 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 320px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { color: #ff6b81; font-size: 24px; margin-bottom: 10px; }
        p { font-size: 16px; color: #ddd; line-height: 1.5; margin-bottom: 25px; }
        .btn {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="card" id="cardContent">
        <h1>I'm Really Sorry... 🥺</h1>
        <p id="messageText">I know I messed up, and you didn't deserve that. Please forgive me?</p>
        <button class="btn" onclick="nextStep()">Forgive me? 💖</button>
    </div>

    <script>
        let step = 1;
        function nextStep() {
            const text = document.getElementById("messageText");
            const card = document.getElementById("cardContent");
            if(step === 1) {
                text.innerHTML = "You mean everything to me, and I promise to do better for you ✨";
                step++;
            } else {
                card.innerHTML = "<h1>Thank You! 🥰</h1><p>You've made me the happiest. I love you!</p>";
            }
        }
    </script>
</body>
</html>
