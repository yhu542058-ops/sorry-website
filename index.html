<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Sorry Letter to You...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #1b1b3a 0%, #0d0d1a 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 320px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 { color: #ff6b81; font-size: 21px; margin-bottom: 12px; }
        p { font-size: 15px; color: #ddd; line-height: 1.6; margin-bottom: 25px; }
        .btn {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 15px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .emoji-icon { font-size: 45px; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>

    <div class="card" id="cardContent">
        <span class="emoji-icon" id="cardEmoji">🧸</span>
        <h1 id="cardTitle">It's late night... 🌙</h1>
        <p id="messageText">I've been walking for hours, holding something heavy... not in hands, but in heart...</p>
        <button class="btn" id="actionBtn" onclick="nextStep()">Let me talk...</button>
    </div>

    <script>
        let step = 1;
        function nextStep() {
            const emoji = document.getElementById("cardEmoji");
            const title = document.getElementById("cardTitle");
            const text = document.getElementById("messageText");
            const btn = document.getElementById("actionBtn");

            if (step === 1) {
                emoji.innerHTML = "🥺";
                title.innerHTML = "My Sorry Letter to You...";
                text.innerHTML = "I've been sitting here for hours, trying to find the right words to tell you how sorry I am.";
                btn.innerHTML = "Continue reading...";
                step++;
            } else if (step === 2) {
                emoji.innerHTML = "💔";
                title.innerHTML = "I know I hurt you...";
                text.innerHTML = "You didn't deserve that. I realize how much I've hurt the most precious person in my life.";
                btn.innerHTML = "Read my letter...";
                step++;
            } else if (step === 3) {
                emoji.innerHTML = "✨";
                title.innerHTML = "I'm so sorry...";
                text.innerHTML = "I know words can't undo what I did, but I need you to know that you mean everything to me. I promise to do better, to be better, for you.";
                btn.innerHTML = "Can you please forgive me?...";
                step++;
            } else if (step === 4) {
                emoji.innerHTML = "🫂";
                title.innerHTML = "Just your arms around me...";
                text.innerHTML = "I don't need anything fancy right now. Just your arms around me, that's all I want.";
                btn.innerHTML = "Send a hug 💖";
                step++;
            } else {
                emoji.innerHTML = "🌹";
                title.innerHTML = "I have something special for you...";
                text.innerHTML = "This flower will never wilt. Just like my love for you. I promise to cherish you every single day! You mean everything to me. 🥰";
                btn.style.display = "none";
            }
        }
    </script>
</body>
</html>
